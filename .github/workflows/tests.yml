name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    # The site re-typesets the papers from Markdown on every push to main, so a
    # malformed formula would be published rather than merely broken locally. This
    # runs on pull requests as well, to catch it before it reaches main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc
      - name: Every formula opens, closes and is balanced
        run: python site/check_math.py

  lean:
    # The formal files claim to compile with no `sorry`. That claim is worth exactly
    # as much as the machine that checks it, so it is checked here rather than
    # asserted in a README — the authoring environment has no Lean toolchain and
    # cannot reach the toolchain host, so CI is the only place the claim can be
    # verified at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 via elan
        run: |
          curl -sSf -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.9.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the formal development
        run: |
          lean --version
          fail=0
          for f in formal/*.lean; do
            echo "::group::$f"
            if lean "$f"; then echo "OK $f"; else echo "FAIL $f"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      - name: No `sorry` anywhere in the formal development
        # A file that compiles while containing `sorry` proves nothing; grep is a
        # cheap guard against the failure mode a green build would otherwise hide.
        run: |
          if grep -rn '\bsorry\b' formal/*.lean; then
            echo "found 'sorry' in the formal development" >&2
            exit 1
          fi
          echo "no sorry found"

  shared-lib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (library core only -- no data downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: shared_lib self-tests
        # Reproduces the papers' own numerical claims: square-root curvature K=1/4 at
        # N=2,3,4; log/exp round-trip and norm-preserving transport; Girsanov drift
        # identifiability; the covariate-anchored jump guardrail; log-Euclidean and
        # Bures-Wasserstein identities; exact Helmholtz-Hodge split.
        run: python -m experiments.shared_lib.test_shared_lib
      - name: Import check on every experiment module
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("experiments").glob("paper*/*/run.py")):
              mod = str(p.with_suffix("")).replace("/", ".")
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  # optional heavy deps (loaders, baselines) are not installed in CI
                  if isinstance(e, ImportError):
                      print(f"skip {mod}: optional dependency ({e})")
                  else:
                      bad.append((mod, repr(e)))
          if bad:
              for m, e in bad:
                  print(f"FAIL {m}: {e}", file=sys.stderr)
              sys.exit(1)
          print("all experiment modules import cleanly")
          PY
