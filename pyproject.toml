[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jvp-geodesic-kinematics"
version = "0.1.0"
description = "SPD-manifold geometry, jump-diffusion demarcation, and change-point detectors for non-stationary multichannel signals on curved state spaces (JVP trilogy, Paper 3)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "João Vitor Perazzolo" }]
keywords = [
    "riemannian-geometry", "spd-manifold", "change-point-detection",
    "jump-diffusion", "eeg", "non-stationary-time-series",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Real-data loaders (EDF / WFDB-MATLAB); not needed for the library core.
data = ["pyedflib>=0.1.30", "mne>=1.6"]
# Baseline change-point methods used by the Paper 3 benchmark.
benchmark = ["ruptures>=1.1", "hmmlearn>=0.3", "scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/fcadusims-droid/ACADEMIC-JVP-WORK-"

[tool.setuptools]
packages = ["experiments", "experiments.shared_lib"]

[tool.pytest.ini_options]
testpaths = ["experiments/shared_lib"]
python_files = ["test_*.py"]
